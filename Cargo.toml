[package]
name = "nav-cli"
version = "0.3.0"
edition = "2021"
description = "A semantic directory bookmarking tool built for both humans and AI Agents."
license = "MIT"
repository = "https://github.com/15935648a/nav"
readme = "README.md"

[[bin]]
name = "nav"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
